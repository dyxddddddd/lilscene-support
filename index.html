<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="联系小场面技术支持，反馈 App 使用问题或提出功能建议。">
  <meta name="theme-color" content="#faf8fc">
  <title>小场面 · 技术支持</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf8fc;
      --ticket: #eee7fa;
      --ink: #241b32;
      --muted: #5d5269;
      --accent: #513293;
      --rule: #b2a0ca;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 48px, 672px); margin: clamp(32px, 9vw, 100px) auto; }
    header, section { padding-inline: clamp(20px, 5vw, 42px); }
    header {
      background: var(--ticket);
      border-radius: 20px;
      padding-block: clamp(28px, 6vw, 52px);
    }
    .app-name { margin: 0; color: var(--accent); font-weight: 650; }
    h1 { margin: 8px 0 16px; font-size: clamp(2.25rem, 8vw, 3.5rem); line-height: 1.1; }
    h2 { margin: 0 0 10px; font-size: 1.25rem; }
    p, li { line-height: 1.75; }
    .intro { margin: 0; color: var(--muted); }
    section { padding-block: 26px; }
    section + section { border-top: 1px dashed var(--rule); }
    section p { margin: 0 0 12px; }
    ul { padding-inline-start: 1.4em; margin: 0 0 14px; }
    li + li { margin-block-start: 4px; }
    a { color: var(--accent); text-underline-offset: .22em; overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="app-name">小场面</p>
      <h1>技术支持</h1>
      <p class="intro">小场面是你的 iPhone 追星手账，用来记录现场、收藏票根与回忆、整理艺人档案和账单。</p>
    </header>
    <section aria-labelledby="contact">
      <h2 id="contact">联系小场面</h2>
      <p>如果你在使用 App 时遇到问题，或者有功能建议，欢迎通过电子邮件联系我们。</p>
      <p><a href="mailto:asterdong0409@163.com?subject=%E5%B0%8F%E5%9C%BA%E9%9D%A2%20App%20%E5%8F%8D%E9%A6%88">asterdong0409@163.com</a></p>
    </section>
    <section aria-labelledby="report">
      <h2 id="report">反馈问题时可以附上</h2>
      <ul>
        <li>iPhone 型号、iOS 版本和小场面 App 版本</li>
        <li>遇到问题的页面、操作步骤和出现的提示</li>
        <li>能说明问题的截图（如有）</li>
      </ul>
      <p class="muted">发送截图前，请遮盖票根二维码、订单号和支付凭证等个人信息。</p>
    </section>
  </main>
</body>
</html>
